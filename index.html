    <script>
      (function () {
        try {
          var origFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : undefined;
          if (origFetch) {
            var patchTarget = function (target) {
              if (!target) return;
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (!desc || (!desc.writable && !desc.set)) {
                try {
                  Object.defineProperty(target, 'fetch', {
                    configurable: true,
                    enumerable: true,
                    get: function () {
                      return origFetch;
                    },
                    set: function (fn) {
                      if (typeof fn === 'function') {
                        origFetch = fn;
                      }
                    },
                  });
                } catch (_) {}
              }
            };
            patchTarget(window);
            patchTarget(Window.prototype);
            patchTarget(globalThis);
          }
          window.addEventListener(
            'error',
            function (event) {
              var msg = String((event && event.message) || '');
              var file = String((event && event.filename) || '');
              if (
                msg.indexOf('Cannot set property fetch') !== -1 ||
                file.indexOf('chrome-extension://') === 0
              ) {
                event.stopImmediatePropagation();
                event.preventDefault();
                return false;
              }
            },
            true
          );
        } catch (e) {}
      })();
    </script>
